name: Release

# Push a tag like v0.15.4 (matching "version" in manifest.json) to build and publish the plugin.
# Zotero finds new versions through update.json on the latest release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            editor-src/package-lock.json
            engine-src/package-lock.json
      - name: Check the tag matches manifest.json
        run: |
          version=$(node -p 'require("./manifest.json").version')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match manifest.json version $version"; exit 1
          fi
      - name: Build the plugin
        run: ./build.sh
      - name: Syntax-check every script
        run: for f in bootstrap.js content/*.js; do node --check "$f"; done
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          gh release create "$GITHUB_REF_NAME" "dist/second-brain-$version.xpi" dist/update.json \
            --title "Second Brain $version" --generate-notes
