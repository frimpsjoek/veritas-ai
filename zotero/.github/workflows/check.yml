name: Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            editor-src/package-lock.json
            engine-src/package-lock.json
            agent-src/package-lock.json
      - name: Install the AI agent's dev tools (agent-src)
        run: cd agent-src && npm ci
      - name: Test the AI agent (agent-src)
        run: cd agent-src && npm test
      # checkJs over every src/**/*.js and *.mjs file, not only the .d.ts contracts; any error fails the build.
      - name: Type-check the AI agent (agent-src)
        run: cd agent-src && npm run typecheck
      - name: Build the plugin
        run: ./build.sh
      - name: Syntax-check every script
        run: for f in bootstrap.js content/*.js; do node --check "$f"; done
      - name: Check the settings page is valid XML
        run: python3 -c "import xml.dom.minidom as m; m.parse('content/preferences.xhtml')"
      - name: Check update.json names this version
        run: |
          version=$(node -p 'require("./manifest.json").version')
          node -e 'const u = require("./dist/update.json"); const v = Object.values(u.addons)[0].updates[0].version; if (v !== process.argv[1]) { console.error(`update.json says ${v}`); process.exit(1); }' "$version"
      - uses: actions/upload-artifact@v7
        with:
          name: second-brain-xpi
          path: dist/
          # Short-lived: these count toward the account-wide artifact storage quota (hit 2026-10-20).
          retention-days: 7
