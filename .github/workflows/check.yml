name: Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # spec 024 G2: Veritas runs on macOS, Windows and Linux, so every part is checked on all three.
    strategy:
      fail-fast: false  # one system failing still shows how the other two did
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash  # check.sh is sh; on Windows this is Git Bash
    steps:
      # Windows runners turn LF into CRLF on checkout, which breaks sh scripts and the committed-file checks.
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            agent/package-lock.json
            ui/package-lock.json
            web/package-lock.json
            obsidian/package-lock.json
            zotero/package-lock.json
            zotero/editor-src/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Server venv
        run: |
          python -m venv server/.venv
          if [ -x server/.venv/bin/python ]; then py=server/.venv/bin/python; else py=server/.venv/Scripts/python.exe; fi
          "$py" -m pip install -r server/requirements.txt
      - name: Check every part
        run: ./check.sh
        env:
          PYTHONUTF8: "1"  # Windows Python otherwise reads notes and settings in the ANSI code page
      - uses: actions/upload-artifact@v7
        if: matrix.os == 'ubuntu-latest'  # the xpi is the same on every system: upload it once
        with:
          name: veritas-zotero-xpi
          path: zotero/dist/
          # Short-lived: these count toward the account-wide artifact storage quota (hit 2026-10-20).
          retention-days: 7
