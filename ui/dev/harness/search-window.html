<!doctype html>
<!--  ui-src/dev/harness/search-window.html. The REAL content/search.js (Zotero search window) on stubbed chrome globals (Zotero, Services,
     window.arguments, a fake SecondBrain), to check the window outside Zotero: query, Papers-only, open a hit, online mode, Add.
     (The spec 005 D1 panel components live in panels.html.) The original header follows: The spec 005 D1 panel components (Section, Row, SearchBar, PaperCard, Highlight, StatusPanel, states)
     with invented content. ?tokens=zotero|obsidian, ?theme=dark, ?w=<px>. dev/panels-checks.mjs drives it through window.__sbPanels. -->
<html>
<head>
<meta charset="utf-8">
<title>Second Brain UI: search window</title>
<link rel="stylesheet" href="/repo/content/sb-ui.css">
<link id="tokens" rel="stylesheet" href="../../styles/tokens-zotero.css">
<style id="standins">
  /* Harness-only: stand-ins for the real host theme variables tokens-*.css maps from. Neither real app ships
     this file; it exists so the harness page has *something* to render light and dark against. Declared where
     each host declares them: Zotero on :root, Obsidian on body (the script below moves them for ?tokens=obsidian),
     so a token map that reads them at the wrong level resolves empty here too, as it would in the app. */
  :root {
    --material-background: #ffffff; --material-sidepane: #f4f4f5; --material-button: #eeeeee;
    --fill-primary: #1b1b1f; --fill-secondary: #55555c; --fill-tertiary: #8b8b93; --fill-quinary: #e2e2e6;
    --color-accent: #3478f6; --accent-red: #d1453d; --accent-green: #2f9e44;
    --background-primary: #ffffff; --background-secondary: #f4f4f5; --interactive-normal: #eeeeee;
    --text-normal: #1b1b1f; --text-muted: #55555c; --text-faint: #8b8b93; --background-modifier-border: #e2e2e6;
    --background-modifier-hover: #ececee; --interactive-accent: #7c6cf0; --text-on-accent: #ffffff;
    --text-error: #d1453d; --color-green: #2f9e44; --font-interface: -apple-system, sans-serif; --font-monospace: monospace;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --material-background: #1e1e20; --material-sidepane: #17171a; --material-button: #2a2a2e;
    --fill-primary: #ededf0; --fill-secondary: #b2b2b8; --fill-tertiary: #7c7c84; --fill-quinary: #38383d;
    --color-accent: #6ea1ff; --accent-red: #ff6b64; --accent-green: #5fd873;
    --background-primary: #1e1e20; --background-secondary: #17171a; --interactive-normal: #2a2a2e;
    --text-normal: #ededf0; --text-muted: #b2b2b8; --text-faint: #7c7c84; --background-modifier-border: #38383d;
    --background-modifier-hover: #2f2f34; --interactive-accent: #9c8cff; --text-on-accent: #17171a;
    --text-error: #ff6b64; --color-green: #5fd873;
  }
  body { margin: 0; padding: 16px; background: var(--sb-ui-bg, #fff); }
  body.bare { padding: 0; }
</style>
<script src="/repo/content/sb-ui.js"></script>
</head>
<body>
<div id="app" class="sb-p"></div>

<link rel="stylesheet" href="/repo/content/search.css">
<script type="module" src="./search-window.js"></script>
</body>
</html>
