<!-- Layout helpers for the browser editor (`slides edit`, Obsidian Slides hub "Edit"). Edit mode only (?edit=1 or #edit),
     except the slide memory, which also runs in the plain preview so "Edit" opens on the slide you were looking at.
     - Grid view: 20 px minor and 100 px major lines, slide centre lines, content margins (6 %) and the footer line.
     - Snap (move): a dragged block aligns its left/centre/right and top/middle/bottom to the same lines of every other
       block on the slide, to the slide centre and margins (smart guides, drawn in magenta), otherwise to the 20 px grid.
     - Match (resize): a resized block snaps its moving edge to other blocks' edges and matches their width or height
       (the matched block is outlined), otherwise to the grid. Images keep their aspect ratio.
     - Arrow keys move the picked block by one grid step (Shift: 1 px). Hold Alt while dragging to place freely.
     - Toggles: toolbar buttons "Grid" / "Snap", or Alt+G / Alt+S. Both remembered per browser.
     - Align: picked block to the slide (margins, centre, footer line) or picked blocks to the last one clicked;
       Distribute: equal gaps between all picked blocks on the slide; Same width / height as the last one clicked.
     - Font / Theme pickers: font previews at once; both are written into the YAML header on Save.
     - Safety: the title slide is locked (its text comes from the YAML header: title, subtitle, author, date), and
       Save always writes back the original YAML header, so an edit can never land inside it.
     Coordinates are slide pixels (1600 x 900), the same numbers the editor writes into the .qmd. -->
<style>

    line-height: var(--r-heading-line-height); color: var(--r-heading-color); letter-spacing: var(--r-heading-letter-spacing);
    text-transform: var(--r-heading-text-transform); }

    document.addEventListener('mousedown', function (e) {
      if (e.target.closest && e.target.closest('#editable-toolbar, .slides-cover-panel')) return;
      selected = (e.target.closest && e.target.closest('.editable-container')) || null;
      setTimeout(function () {   // a click that picks a block creates its frame a moment later
        if (!selected) { var c = document.querySelector('.reveal .slides section.present .editable-container.active'); if (c && c.contains(e.target)) selected = c; }
      }, 50);
    }, true);
    document.addEventListener('click', function (e) {
      var c = e.target.closest && e.target.closest('.editable-container');
      if (c) selected = c;
    }, true);
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !(document.activeElement && document.activeElement.isContentEditable)) selected = null; }, true);
    Reveal.on('slidechanged', function () { selected = null; });
    // a frame the editor creates for a pick becomes the selection (it is built after our click handlers run)
    new MutationObserver(function (muts) {
      muts.forEach(function (m) { m.addedNodes.forEach(function (n) {
        if (n.nodeType === 1 && n.classList.contains('editable-container')) selected = n;
      }); });
    }).observe(document.querySelector('.reveal .slides') || document.body, { subtree: true, childList: true });
    window.slidesEditTools && (window.slidesEditTools.selection = function () { return selected; });
    Reveal.configure({ overview: false, keyboardCondition: function (e) {
      if ((selected && selected.isConnected) || document.querySelector('.reveal .slides section.present .editable-container.active')) return false;
      var a = document.activeElement;
      if (a && (a.isContentEditable || /INPUT|TEXTAREA|SELECT/.test(a.tagName) || (a.closest && a.closest('.editable-container, #editable-toolbar, .slides-cover-panel, .ql-toolbar')))) return false;
      if (e.key === 'Escape') return false;
      if (/^Arrow/.test(e.key) && document.querySelector('.reveal .slides section.present .editable-container.active')) return false;
      return true;
    } });
  });
  // ---------------------------------------------------------------- arrow keys: one grid step (Shift: 1 px)
  document.addEventListener('keydown', function (e) {
    if (e.altKey && !e.ctrlKey && !e.metaKey) {
      if (e.code === 'KeyG') { e.preventDefault(); setGrid(!gridOn); return; }
      if (e.code === 'KeyS') { e.preventDefault(); setSnap(!snapOn); return; }
    }
    var dir = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[e.key];
    if (!dir || e.metaKey || e.ctrlKey || e.altKey) return;
    var a = document.activeElement;
    if (a && (a.isContentEditable || /INPUT|TEXTAREA|SELECT/.test(a.tagName))) return;
    var c = (a && a.closest && a.closest('.editable-container')) || document.querySelector('.reveal .slides section.present .editable-container.active');
    var el = eltFor(c);
    if (!el || !el.state) return;
    if (el.syncFromDOM) el.syncFromDOM();
    e.preventDefault(); e.stopPropagation();
    if (window.editable && window.editable.pushUndoState) window.editable.pushUndoState();
    var s = el.state, step = e.shiftKey || !snapOn ? 1 : GRID;
    var nx = s.x + dir[0] * step, ny = s.y + dir[1] * step;
    if (step === GRID) { if (dir[0]) nx = dir[0] > 0 ? Math.floor(s.x / GRID + 1) * GRID : Math.ceil(s.x / GRID - 1) * GRID;
                         if (dir[1]) ny = dir[1] > 0 ? Math.floor(s.y / GRID + 1) * GRID : Math.ceil(s.y / GRID - 1) * GRID; }
    el.setState({ x: nx, y: ny });
  }, true);
})();
